# Overrides on top of detekt's default rules (buildUponDefaultConfig = true).
# Each override says why; keep this file short.

naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # Compose files are named after their primary composable, with its small model type beside it.
    active: false
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    # Stateless composables take state plus callbacks plus a Modifier; Hilt constructors list their dependencies.
    ignoreAnnotated: ['Composable', 'Inject']
  TooManyFunctions:
    ignoreAnnotated: ['Preview', 'WaiveraPreviews']
    # Interface implementations (notifier, repositories) are sized by their interface.
    ignoreOverridden: true

style:
  MagicNumber:
    # Design tokens are the one place literal dp, sp and colour values live.
    excludes: ['**/core/designsystem/**', '**/test/**', '**/androidTest/**']
    # A number assigned to a named property is already named; previews hold sample data.
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Preview', 'WaiveraPreviews']
  UnusedPrivateMember:
    # WaiveraPreviews is the light/dark/200% font multipreview from core:designsystem.
    ignoreAnnotated: ['Preview', 'WaiveraPreviews']
